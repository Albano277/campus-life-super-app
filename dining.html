<!DOCTYPE html>
<!--
    Author: Maria Albano
    Date: October 15, 2026
    Project: Campus Life Super App
    Description: Dining page for finding restaurants near campus.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Dining - Campus Life Super App</title>
    <!-- Bootstrap 5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

  <!-- Introduces the campus dining search feature. -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Website Header -->
    <header>
        <h1>Campus Life Super App</h1>
    </header>

    <!-- Main Navigation Menu -->
    <nav aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="dining.html">Dining</a>
    </nav>

    <!-- Main Content -->
    <main>
        <section class="container my-4">
    <h2>Campus Dining</h2>
    <p>Discover restaurants and cafes near colleges in Springfield, Massachusetts.</p>

    <!-- College selection -->
    <div class="mb-3">
        <label for="college-select" class="form-label">Choose a College</label>

        <select id="college-select" class="form-select">
            <option value="aic">American International College</option>
            <option value="springfield">Springfield College</option>
            <option value="western">Western New England University</option>
            <option value="stcc">Springfield Technical Community College</option>
        </select>
    </div>

    <!-- Dining Search Button -->
    <button id="dining-button" class="btn btn-primary">
        Find Dining
    </button>

    <!-- Dining API Results -->
    <div id="dining-results" class="row mt-4" aria-live="polite"></div>
</section>
    </main>

    <!-- Website Footer -->
    <footer>
        <p>&copy; 2026 Campus Life Super App. All rights reserved.</p>
        <p>Created by Maria Albano</p>
    </footer>
<!-- JavaScript handles dining searches and displays restaurant results. -->
<script src="js/dining.js"></script>
</body>
</html>
